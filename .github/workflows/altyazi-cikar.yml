# Konuşmalı videoların sözlerini zaman damgalarıyla yazıya döker (Whisper).
# Girdi: depo/ altındaki mp4 yolları (boşlukla ayrılmış). Sonuç: işin özetinde ve "altyazi-ham" eserinde JSON.
# Çalıştırma: GitHub → Actions → "Altyazı çıkar" → Run workflow
name: Altyazı çıkar

on:
  workflow_dispatch:
    inputs:
      dosyalar:
        description: "depo/ altındaki mp4 yolları (boşlukla ayrılmış)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  cikar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Ana daldaki bölümleri al (TUM)
        if: ${{ inputs.dosyalar == 'TUM' }}
        run: |
          git fetch -q --depth=1 origin main
          git checkout -q FETCH_HEAD -- depo/karakterler
          ls depo/karakterler | wc -l
      - name: Kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q openai-whisper
      - name: Yazıya dök
        env:
          DOSYALAR: ${{ inputs.dosyalar }}
        run: |
          mkdir -p cikti
          python3 - <<'PY'
          import json, os, whisper
          m = whisper.load_model("small.en")
          out = {}
          import glob, re
          liste = os.environ["DOSYALAR"].split()
          if liste == ["TUM"]:
              liste = sorted(f for f in glob.glob("depo/karakterler/*-ep*.mp4") if re.search(r"/[a-z]+-ep\d+\.mp4$", f))
          print("dosya sayısı:", len(liste))
          for f in liste:
              if not (f.startswith("depo/") and f.endswith(".mp4") and ".." not in f and os.path.exists(f)):
                  print("atlandı:", f); continue
              r = m.transcribe(f, language="en", word_timestamps=True, condition_on_previous_text=False)
              segs = [{"start": round(s["start"], 2), "end": round(s["end"], 2), "text": s["text"].strip(), "ns": round(s.get("no_speech_prob", 0), 2), "lp": round(s.get("avg_logprob", 0), 2)} for s in r["segments"]]
              out[f] = segs
              print("##", f)
              for s in segs: print(f'{s["start"]:6.2f} {s["end"]:6.2f} ns={s["ns"]} lp={s["lp"]}  {s["text"]}')
          json.dump(out, open("cikti/altyazi.json", "w"), ensure_ascii=False, indent=1)
          if len(out) < 20:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
                  fh.write("```json\n" + json.dumps(out, ensure_ascii=False, indent=1) + "\n```\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: altyazi-ham
          path: cikti/altyazi.json
          retention-days: 7
