name: Transkript (whisper)
on:
  push:
    branches: [uretim-ham]
    paths: ['uretim-plan/transkript/**']
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q faster-whisper
      - name: Transcribe
        run: |
          python3 - <<'PY'
          import json,glob,subprocess,os
          from faster_whisper import WhisperModel
          m=WhisperModel("small.en",compute_type="int8")
          for j in glob.glob('uretim-plan/transkript/*.json'):
              c=json.load(open(j))
              for it in c['files']:
                  src=it['src']; out=it['out']
                  if os.path.exists(out): continue
                  import wave,numpy as np
                  w=wave.open(src); a=np.frombuffer(w.readframes(w.getnframes()),np.int16).astype(np.float32)/32768
                  segs,_=m.transcribe(a,word_timestamps=False,vad_filter=True)
                  r=[{'s':round(s.start,2),'e':round(s.end,2),'t':s.text.strip()} for s in segs]
                  os.makedirs(os.path.dirname(out),exist_ok=True)
                  json.dump(r,open(out,'w'),ensure_ascii=False,indent=0)
          PY
      - run: |
          git config user.name uretim-bot; git config user.email uretim-bot@users.noreply.github.com
          git add gelen; git diff --cached --quiet && exit 0
          git commit -m "transkript"; for i in 1 2 3; do git push origin HEAD:uretim-ham && exit 0; git pull --no-rebase --no-edit origin uretim-ham; done
