# Uygulamayla birlikte gelen video ve afişleri indirir, küçültür ve depoya ekler.
#
# scripts/varliklar.json dosyasındaki her kayıt için kaynağı indirir:
#   görsel -> public/<hedef>.webp (540 piksel genişlik)
#   video  -> public/<hedef>.mp4  (480 piksel genişlik, H.264 + AAC)
# Sonucu çalıştığı dala işler. Dosyalar public/ altında olduğu için hem web
# sitesine hem Android paketine girer.
#
# Çalıştırma: GitHub → Actions → "Varlıkları indir" → Run workflow
name: Varlıkları indir

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: varlik-indir
  cancel-in-progress: false

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq

      - name: İndir ve küçült
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          count="$(jq 'length' scripts/varliklar.json)"
          for i in $(seq 0 $((count - 1))); do
            hedef="$(jq -r ".[$i].hedef" scripts/varliklar.json)"
            gorsel="$(jq -r ".[$i].gorsel // empty" scripts/varliklar.json)"
            video="$(jq -r ".[$i].video // empty" scripts/varliklar.json)"
            # Hedef yalnızca public/ altında, harf-rakam-tire içeren bir yol olabilir.
            if ! printf '%s' "$hedef" | grep -Eq '^[a-z0-9-]+/[a-z0-9-]+$'; then
              echo "::error::Geçersiz hedef: $hedef"; exit 1
            fi
            mkdir -p "public/$(dirname "$hedef")"
            if [ -n "$gorsel" ]; then
              curl -fsSL --retry 3 --max-time 120 -o "$tmp/g" -- "$gorsel"
              ffmpeg -loglevel error -y -i "$tmp/g" -vf "scale=540:-2" -quality 80 "public/$hedef.webp"
              echo "görsel: public/$hedef.webp ($(stat -c %s "public/$hedef.webp") bayt)"
            fi
            if [ -n "$video" ]; then
              curl -fsSL --retry 3 --max-time 300 -o "$tmp/v" -- "$video"
              ffmpeg -loglevel error -y -i "$tmp/v" -vf "scale=480:-2" -c:v libx264 -crf 27 -preset slow \
                -pix_fmt yuv420p -c:a aac -b:a 64k -movflags +faststart "public/$hedef.mp4"
              echo "video: public/$hedef.mp4 ($(stat -c %s "public/$hedef.mp4") bayt)"
            fi
          done
          du -sh public

      - name: Depoya işle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Varlıklar: Snooze bölümleri ve karakter fragmanları (otomatik indirme)"
            git push
          fi
